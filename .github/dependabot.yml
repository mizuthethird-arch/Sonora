version: 2
updates:
  # modules/_template follows the root versions because only "/" is listed.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react*"
      vite:
        patterns:
          - vite
          - "@vitejs/*"
          - "vite-plugin-*"
      testing:
        patterns:
          - vitest
          - "@vitest/*"
          - "@testing-library/*"
          - supertest
          - msw
          - playwright
          - "@playwright/*"
      lint:
        patterns:
          - eslint
          - "eslint-*"
          - "@eslint/*"
          - prettier
          - typescript-eslint
          - "@commitlint/*"
          - dependency-cruiser
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
