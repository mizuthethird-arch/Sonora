name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for secrets
        run: docker compose -f docker-compose.yml run --rm gitleaks
      - name: Build workspace image
        run: docker compose -f docker-compose.yml build workspace
      - name: Lint, typecheck, test, build
        run: docker compose -f docker-compose.yml run --rm workspace pnpm run ci
